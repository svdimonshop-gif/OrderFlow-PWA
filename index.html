  <!-- Inline bridge: shown until Flutter paints its first frame.
       Keep it iconless so the browser/PWA preloader never shows a square logo. -->
  <style>
    html,
    body,
    #of-splash {
      margin: 0;
      background: #06080C;
    }
    #of-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.16s ease-out;
    }
    #of-splash img {
      width: clamp(220px, 60vmin, 260px);
      height: clamp(220px, 60vmin, 260px);
      object-fit: contain;
    }
    /* Flutter adds this class to <html> after its first painted frame. */
    html.of-loaded #of-splash {
      opacity: 0;
      pointer-events: none;
    }
    #of-update {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10000;
      display: none;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 14px;
      color: #F4F7FB;
      background: #1A2230;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
      font: 500 14px/1.35 system-ui, sans-serif;
    }
    #of-update button {
      flex: none;
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      color: #061018;
      background: #41D9FF;
      font: inherit;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      #of-splash { transition: none; }
    }
  </style>

<body>
  <!-- Pre-Flutter bridge matching the Flutter splash. -->
  <div id="of-splash" aria-hidden="true">
    <img src="icons/Icon-any-v2-512.png" alt="">
  </div>
  <div id="of-update" role="status" aria-live="polite">
    <span>Доступне оновлення. Завершіть поточну дію, потім оновіть застосунок.</span>
    <button type="button">Оновити</button>
  </div>

  <script src="orderflow_web.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const banner = document.getElementById('of-update');
        const button = banner.querySelector('button');
        let waitingWorker = null;

        const showUpdate = (worker) => {
          waitingWorker = worker;
          banner.style.display = 'flex';
        };
        button.addEventListener('click', () => {
          if (waitingWorker) waitingWorker.postMessage({ type: 'OF_ACTIVATE_UPDATE' });
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // This only follows an explicit button press for an update.
          window.location.reload();
        });

        const registration = await navigator.serviceWorker.register('sw.js');
        if (registration.waiting) showUpdate(registration.waiting);
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdate(worker);
            }
          });
        });
      });
    }
  </script>
