<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/OrderFlow-PWA/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OrderFlow — робочий застосунок для збирання та видачі замовлень.">

  <!-- Theme color: media-aware so the browser chrome / PWA top bar matches the
       OS color scheme before Flutter loads. The runtime value is also updated
       from Dart (web_theme_color.dart) when the user toggles theme manually. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06080C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrderFlow">
  <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OrderFlow</title>
  <link rel="manifest" href="manifest.json">

  <!-- Inline splash: shown until Flutter paints its first frame.
       Background and logo adapt to the OS color scheme via CSS so there is no
       light flash in dark mode. flutter_bootstrap.js hides #splash afterwards. -->
  <style>
    #of-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F8F2;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #of-splash img {
      width: 128px;
      height: 128px;
      /* Logo is a solid blue circle with transparency; no border/outline. */
      border-radius: 28%;
      object-fit: contain;
    }
    @media (prefers-color-scheme: dark) {
      #of-splash { background: #06080C; }
    }
    /* flutter_bootstrap.js adds this class to <html> on first frame. */
    html.of-loaded #of-splash {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Pre-Flutter splash. -->
  <div id="of-splash">
    <img src="icons/Icon-512.png" alt="OrderFlow">
  </div>

  <script src="orderflow_web.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
