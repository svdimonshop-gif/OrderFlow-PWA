  <!-- Inline bridge: shown until Flutter paints its first frame.
       Keep it iconless so the browser/PWA preloader never shows a square logo. -->
  <style>
    html,
    body,
    #of-splash {
      margin: 0;
      background: #06080C;
    }
    #of-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.16s ease-out;
    }
    #of-splash img {
      width: clamp(220px, 60vmin, 260px);
      height: clamp(220px, 60vmin, 260px);
      object-fit: contain;
    }
    /* Flutter adds this class to <html> after its first painted frame. */
    html.of-loaded #of-splash {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #of-splash { transition: none; }
    }
  </style>
</head>
